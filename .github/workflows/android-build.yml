name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Live Backend Server URL (e.g. https://fitnessdrive.vercel.app)'
        required: false
        default: 'https://fitnessdrive.vercel.app'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Web App
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_build_jwt_secret_32_chars_long_key_sample' }}
          NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.server_url || 'https://fitnessdrive.vercel.app' }}
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || 'https://fitnessdrive.vercel.app' }}
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessDrive-Gym-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

